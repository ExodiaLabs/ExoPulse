name: exopulse

x-php: &php
  build:
    context: .
    target: dev
  image: exopulse-php:dev
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /app
  env_file:
    - path: .env.local
      required: false
  environment:
    APP_ENV: dev
    DATABASE_URL: postgresql://${POSTGRES_USER:-exopulse}:${POSTGRES_PASSWORD:-exopulse}@database:5432/${POSTGRES_DB:-exopulse}?serverVersion=17&charset=utf8
    MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
  volumes:
    - .:/app
  depends_on:
    database:
      condition: service_healthy
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true
  restart: unless-stopped

services:
  php:
    <<: *php
  web:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  database:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exopulse}
      POSTGRES_USER: ${POSTGRES_USER:-exopulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exopulse}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  worker:
    <<: *php
    command: [php, bin/console, messenger:consume, async, --time-limit=3600, --memory-limit=192M, --no-interaction]
    profiles: [worker]
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1']
      interval: 30s
      timeout: 3s
      retries: 3

  scheduler:
    <<: *php
    command: [php, bin/console, app:schedule, --watch, --no-interaction]
    profiles: [worker]
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1']
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  database_data:
