security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    providers:
        administrators:
            memory:
                users:
                    '%env(ADMIN_IDENTIFIER)%':
                        password: '%env(ADMIN_PASSWORD_HASH)%'
                        roles: [ROLE_ADMIN]
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
    firewalls:
        main:
            lazy: true
            provider: administrators
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
    access_control:
        - { path: ^/healthz$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
